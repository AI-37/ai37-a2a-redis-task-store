name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai37-a2a-redis-task-store-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  # Aggregate "green" check with a UNIFORM name across all AI-37 repos (see docs/plans/doc-bot-pr-review.md).
  ci-green:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: gate
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "one or more required CI jobs did not succeed"; exit 1
